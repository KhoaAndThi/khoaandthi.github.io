</style>

<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  componentDidMount() {
    const self = this;
    self._lang = (localStorage.getItem('ktLang') === 'vi') ? 'vi' : 'en';
    self._i18nFallback = {
      en: { clickToOpen: "Click to open", gettingMarried: "We're Getting Married", openBtn: "Open the Invitation", hint: "Scroll to explore", invite: "invite you to join us<br>on our wedding day", at: "at", celebration: "The Celebration", ev: { arrive: "Guests arrive", vows: "Vows ceremony", reception: "Evening reception", ceremony: "Wedding ceremony", party: "Party · DJ" }, whatToWear: "What to Wear", dressCode: "DRESS CODE", confirm: "Confirm your attendance", delighted: "We would be delighted to<br>celebrate this special day with you.", rsvpHere: "RSVP here" },
      vi: { clickToOpen: "Nhấn để mở", gettingMarried: "Chúng tôi sắp kết hôn", openBtn: "Mở thiệp mời", hint: "Cuộn để khám phá", invite: "trân trọng kính mời bạn<br>đến chung vui ngày cưới", at: "tại", celebration: "Lễ Thành Hôn", ev: { arrive: "Đón khách", vows: "Nghi lễ", reception: "Tiệc chiều", ceremony: "Lễ thành hôn", party: "Tiệc · DJ" }, whatToWear: "Trang phục", dressCode: "QUY ĐỊNH TRANG PHỤC", confirm: "Xác nhận tham dự", delighted: "Chúng tôi rất hân hạnh được đón tiếp bạn<br>trong ngày trọng đại này.", rsvpHere: "Phản hồi tại đây" }
    };
    self._applyLang = function () {
      const store = self._i18n || self._i18nFallback;
      const dict = store && store[self._lang];
      if (!dict) return;
      const enB = document.getElementById('langEN'), vnB = document.getElementById('langVN');
      if (enB && vnB) {
        enB.style.background = self._lang === 'en' ? '#4a2420' : 'transparent';
        enB.style.color = self._lang === 'en' ? '#f3ede2' : '#4a2420';
        enB.style.boxShadow = self._lang === 'en' ? '0 2px 6px rgba(40,20,16,0.28)' : 'none';
        vnB.style.background = self._lang === 'vi' ? '#4a2420' : 'transparent';
        vnB.style.color = self._lang === 'vi' ? '#f3ede2' : '#4a2420';
        vnB.style.boxShadow = self._lang === 'vi' ? '0 2px 6px rgba(40,20,16,0.28)' : 'none';
      }
      const ff = self._lang === 'vi' ? "'Cormorant Garamond',serif" : "'Cinzel',serif";
      const setTxt = (id, html) => { const e = document.getElementById(id); if (!e) return; e.innerHTML = html; e.style.fontFamily = ff; };
      setTxt('lblClick', dict.clickToOpen);
      setTxt('lblMarried', dict.gettingMarried);
      setTxt('enterBtn', dict.openBtn);
      setTxt('hintLbl', dict.hint);
      if (self._fillScreens) self._fillScreens(dict);
    };
    self._setLang = function (l) { if (self._lang === l) return; self._lang = l; try { localStorage.setItem('ktLang', l); } catch (_) {} self._applyLang(); };
    const _enB = document.getElementById('langEN'), _vnB = document.getElementById('langVN');
    if (_enB) _enB.addEventListener('click', () => self._setLang('en'));
    if (_vnB) _vnB.addEventListener('click', () => self._setLang('vi'));
    fetch('./i18n.json').then(r => r.json()).then(d => { self._i18n = d; self._applyLang(); }).catch(() => { self._applyLang(); });
    self._applyLang();
    this.setupCover();
    this.setupIntro();
    document.addEventListener('click', (e) => {
      const modal = document.getElementById('rsvpModal');
      if (!modal) return;
      if (e.target && e.target.closest && e.target.closest('#rsvpBtn')) { self._savedScroll = window.scrollY || window.pageYOffset || 0; modal.style.display = 'block'; }
      else if (e.target && e.target.id === 'rsvpClose') {
        modal.style.display = 'none';
        window.scrollTo(0, self._savedScroll || 0);
        try { window.ScrollTrigger && window.ScrollTrigger.refresh(true); } catch(_){}
        window.scrollTo(0, self._savedScroll || 0);
      }
    });
    const guestOtherChk = document.getElementById('guestOtherChk');
    const attOpts = [...(document.querySelectorAll('.att-opt'))];
    attOpts.forEach(opt => opt.addEventListener('change', () => {
      if (opt.checked) attOpts.forEach(o => { if (o !== opt) o.checked = false; });
    }));
    const guestOtherText = document.getElementById('guestOtherText');
    const rsvpForm = document.getElementById('rsvpForm');
    const guestOpts = [...(rsvpForm ? rsvpForm.querySelectorAll('.guest-opt') : [])];
    guestOpts.forEach(opt => opt.addEventListener('change', () => {
      if (opt.checked) guestOpts.forEach(o => { if (o !== opt) o.checked = false; });
      if (guestOtherText) {
        const showOther = guestOtherChk && guestOtherChk.checked;
        guestOtherText.style.display = showOther ? 'block' : 'none';
        if (showOther) guestOtherText.focus();
      }
    }));
    if (rsvpForm) rsvpForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const btn = document.getElementById('rsvpSubmit');
      const msg = document.getElementById('rsvpMsg');
      const parts = [...rsvpForm.querySelectorAll('.att-opt:checked')].map(c => c.value).filter(Boolean);
      const attHidden = document.getElementById('attHidden');
      if (attHidden) attHidden.value = parts.join(', ');
      if (!parts.length) { if (msg) msg.textContent = 'Please tell us if you can attend.'; return; }
      const gParts = [...rsvpForm.querySelectorAll('.guest-opt:checked')].map(c => c.value === '__other__' ? (guestOtherText && guestOtherText.value.trim()) : c.value).filter(Boolean);
      const guestHidden = document.getElementById('guestHidden');
      if (guestHidden) guestHidden.value = gParts.join(', ');
      const ENDPOINT = 'https://script.google.com/macros/s/AKfycbyAN47OdTGhQJ0cchLq84ZWLXYRqQL36_UOOW3KK52KjOvu48YzZW9k6eg0VGX6KU58/exec';
      const data = new URLSearchParams(new FormData(rsvpForm));
      if (btn) { btn.disabled = true; btn.textContent = 'Sending…'; }
      fetch(ENDPOINT, { method: 'POST', mode: 'no-cors', body: data })
        .then(() => {
          rsvpForm.reset();
          if (btn) btn.style.display = 'none';
          if (msg) { msg.textContent = 'Thank you — your reply has been received.'; }
        })
        .catch(() => {
          if (btn) { btn.disabled = false; btn.textContent = 'Send RSVP'; }
          if (msg) { msg.textContent = 'Something went wrong. Please try again.'; }
        });
    });
    if (this.isMobile()) { this.initMobile(); return; }
    let tries = 0;
    (function wait() {
      if (window.THREE && window.gsap && window.ScrollTrigger) {
        if (THREE.CSS3DRenderer) { self.init(); return; }
        const s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS3DRenderer.js';
        s.onload = () => self.init();
        s.onerror = () => self.init();
        document.head.appendChild(s);
      } else if (tries++ < 300) {
        setTimeout(wait, 40);
      }
    })();
  }

  setupCover() {
    const slides = ['ktSlide0','ktSlide1','ktSlide2','ktSlide3'].map(id => document.getElementById(id));
    if (!slides[0]) return;
    const dots = Array.from(document.querySelectorAll('.kt-dot'));
    const self = this;
    let cur = 0, lock = false;
    function show(n) {
      if (n === cur || lock || self._opened) return;
      lock = true;
      const out = slides[cur], inc = slides[n], dir = n > cur ? 1 : -1;
      out.style.opacity = '0'; out.style.transform = 'translateY(' + (dir * -18) + 'px)'; out.style.filter = 'blur(5px)';
      inc.style.transition = 'none';
      inc.style.transform = 'translateY(' + (dir * 18) + 'px)'; inc.style.filter = 'blur(5px)';
      requestAnimationFrame(() => { inc.style.transition = ''; inc.style.opacity = '1'; inc.style.transform = 'translateY(0)'; inc.style.filter = 'blur(0px)'; });
      dots.forEach((d, i) => { d.style.background = i === n ? '#292524' : '#d6d3d1'; d.style.transform = i === n ? 'scale(1.25)' : 'scale(1)'; });
      cur = n;
      setTimeout(() => { lock = false; }, 660);
    }
    this._coverTimer = setInterval(() => show((cur + 1) % slides.length), 3400);
    dots.forEach((d, i) => d.addEventListener('click', () => { clearInterval(self._coverTimer); show(i); }));
    const card = document.getElementById('ktCard');
    if (card) {
      card.addEventListener('click', () => { clearInterval(self._coverTimer); show((cur + 1) % slides.length); });
      if (window.matchMedia('(pointer:fine)').matches) {
        window.addEventListener('mousemove', (e) => {
          if (self._opened) return;
          const x = ((e.clientX / window.innerWidth) - 0.5) * 8, y = ((e.clientY / window.innerHeight) - 0.5) * -8;
          card.style.transform = 'perspective(1000px) rotateX(' + y + 'deg) rotateY(' + x + 'deg)';
        });
      }
    }
  }

  setupIntro() {
    const intro = document.getElementById('intro');
    if (!intro) return;
    const self = this;
    const isMobile = window.matchMedia('(max-aspect-ratio: 1/1)').matches;
    const poster = document.getElementById(isMobile ? 'posterMobile' : 'posterDesktop');
    const other = document.getElementById(isMobile ? 'posterDesktop' : 'posterMobile');
    const video = document.getElementById(isMobile ? 'curtainVideoMobile' : 'curtainVideoDesktop');
    const badge = document.getElementById('introBadge');
    const overlay = document.getElementById('introOverlay');
    if (poster) poster.style.opacity = '1';
    if (other) other.style.opacity = '0';
    let started = false, revealed = false;
    function reveal() {
      if (revealed) return; revealed = true;
      if (badge) badge.style.opacity = '0';
      if (overlay) { overlay.style.opacity = '1'; overlay.style.pointerEvents = 'auto'; }
    }
    function start() {
      if (started) return; started = true;
      if (badge) badge.style.opacity = '0';
      if (!video) { if (poster) poster.style.opacity = '0'; reveal(); return; }
      video.style.opacity = '1';
      const p = video.play();
      if (p && p.then) {
        p.then(() => setTimeout(() => { if (poster) poster.style.opacity = '0'; }, 150))
         .catch(() => { if (poster) poster.style.opacity = '0'; reveal(); });
      } else {
        setTimeout(() => { if (poster) poster.style.opacity = '0'; }, 150);
      }
    }
    if (video) {
      video.addEventListener('timeupdate', () => { if (!revealed && video.currentTime >= 2.4) reveal(); });
      video.addEventListener('ended', () => { video.pause(); reveal(); });
    }
    intro.addEventListener('click', () => { if (!started) start(); });
    const enter = document.getElementById('enterBtn');
    if (enter) enter.addEventListener('click', (e) => { e.stopPropagation(); self.enterInvitation(); });
  }

    let F = computeF();

      const n = 256, cv = document.createElement('canvas'); cv.width = cv.height = n;
      const ctx = cv.getContext('2d');

        const cx = n/2 + (Math.random()-0.5)*n*0.34, cy = n/2 + (Math.random()-0.5)*n*0.34;
        const r = n * (0.24 + Math.random()*0.24);
        const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
        g.addColorStop(0, `rgba(${rgb},0.5)`); g.addColorStop(0.55, `rgba(${rgb},0.22)`); g.addColorStop(1, `rgba(${rgb},0)`);
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.fill();
      }
      const t = new THREE.CanvasTexture(cv); t.needsUpdate = true; return t;
    }
    function dotTexture() {
      const n = 64, cv = document.createElement('canvas'); cv.width = cv.height = n;
      const ctx = cv.getContext('2d');
      const g = ctx.createRadialGradient(n/2, n/2, 0, n/2, n/2, n/2);

      const m = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), mat);

      { src: 'lavender.png',   x: 7.4,  y: -32.6, w: 210, h: 336, amp: 0.08, layer: 'fg', flip: true },

      // ── SCENE 8 · The Final Scene ── garden at sunset framing the names, storybook close
      { src: 'sun.png',        x: 5.6,  y: -32.0, w: 260, h: 260, amp: 0.04, layer: 'bg' },
      { src: 'cloud2.png',     x: -4.6, y: -32.2, w: 560, h: 299, amp: 0.13, layer: 'bg' },
      { src: 'cloud2.png',     x: 5.2,  y: -32.6, w: 480, h: 256, amp: 0.13, layer: 'bg', flip: true },
      { src: 'olivetree.png',  x: -7.9, y: -34.6, w: 360, h: 393, amp: 0.04, layer: 'bg' },
      { src: 'olivetree.png',  x: 7.9,  y: -34.6, w: 360, h: 393, amp: 0.04, layer: 'bg', flip: true },
      { src: 'birds.png',      x: 3.6,  y: -32.6, w: 240, h: 133, amp: 0.05, layer: 'bg' },
      { src: 'laurel.png',     x: 0,    y: -32.7, w: 340, h: 189, amp: 0.03, layer: 'mid' },
      { src: 'whitebloom2.png',x: -6.2, y: -34.5, w: 340, h: 447, amp: 0.09, layer: 'mid' },
      { src: 'whitebloom2.png',x: 6.4,  y: -34.3, w: 340, h: 447, amp: 0.09, layer: 'mid', flip: true },
      { src: 'floral2.png',    x: -4.0, y: -36.1, w: 400, h: 496, amp: 0.09, layer: 'fg' },
      { src: 'floral2.png',    x: 4.0,  y: -35.9, w: 400, h: 496, amp: 0.09, layer: 'fg', flip: true },
      { src: 'lavender.png',   x: -6.6, y: -36.0, w: 210, h: 336, amp: 0.08, layer: 'fg' }
    ];
    const driftCSS = [];
    // Mobile recomposition: thin the background layer (calmer, less overlap) and
    // ease every element down a touch so scenes stay framed instead of overflowing.
    const isMobile = aspect < 0.72;
    let _bg = 0;
    art.forEach(a => {
      const L = LAYER[a.layer] || LAYER.mid;
      if (isMobile && a.layer === 'bg') { _bg++; if (_bg % 2 === 0) return; }
      const sz = isMobile ? 0.88 : 1;
      const el = document.createElement('div');
      el.setAttribute('data-art', '');
      el.style.width = (a.w * sz) + 'px';
      el.style.height = (a.h * sz) + 'px';
      el.style.opacity = L.op;
      el.style.zIndex = a.layer === 'fg' ? '3' : (a.layer === 'mid' ? '2' : '1');
      el.innerHTML = `<img src="./assets/${a.src}" alt="" style="width:100%;height:100%;object-fit:contain;filter:${artFilter(L)};${a.flip ? 'transform:scaleX(-1);' : ''}">`;
      const o = new THREE.CSS3DObject(el);
      const ax = a.x * xScale * FRAME;
      o.position.set(ax, a.y, L.z);
      o.scale.setScalar(F);
      sceneCSS.add(o);
      driftCSS.push({ o, ox: ax, oy: a.y, ph: Math.random()*7, amp: a.amp, sp: 0.5 + Math.random()*0.5 });
    });

    // ---------- camera ----------
    const cam = { x: 0, y: 1.2, z: 12, rz: 0 };
    function applyCam(t) {
      const bx = Math.sin(t * 0.22) * 0.1, by = Math.cos(t * 0.18) * 0.09;
      camera.position.set(cam.x + bx, cam.y + by, cam.z);
      camera.rotation.z = 0;
    }

    // ---------- scroll ----------
    let tl = null;
    const progressWrap = document.getElementById('progress');
    const progressFill = document.getElementById('progressFill');

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();
      applyCam(t);
      for (let i = 0; i < washes.length; i++) {
        const w = washes[i];
        w.m.position.x = w.ox + Math.sin(t * 0.11 * w.sp + w.ph) * 0.3;
        w.m.position.y = w.oy + Math.cos(t * 0.09 * w.sp + w.ph) * 0.26;
        w.m.rotation.z += w.rot;
      }
      for (let i = 0; i < driftCSS.length; i++) {
        const d = driftCSS[i];
        d.o.position.x = d.ox + Math.sin(t * 0.07 * d.sp + d.ph) * d.amp;
        d.o.position.y = d.oy + Math.cos(t * 0.06 * d.sp + d.ph) * d.amp * 0.8;
      }
      const arr = pGeo.attributes.position.array;
      for (let i = 0; i < pCount; i++) {
        arr[i*3+1] += pVel[i] * 0.011;
        arr[i*3] += Math.sin(t * 0.5 + i) * 0.0009;
        if (arr[i*3+1] > 3.5) { arr[i*3+1] = -43; arr[i*3] = (Math.random()-0.5)*18*xScale; }
      }
      pGeo.attributes.position.needsUpdate = true;
      renderer.render(sceneGL, camera);
      css3d.render(sceneCSS, camera);
    }
    animate();

    function rebuildJourney() {
      if (tl) { if (tl.scrollTrigger) tl.scrollTrigger.kill(); tl.kill(); tl = null; }
      buildJourney();
    }
    let _wasMobile = aspect < 1;
    function onResize() {
      W = window.innerWidth || W; H = window.innerHeight || H; aspect = (W > 0 && H > 0) ? W / H : aspect;
      camera.aspect = aspect; camera.updateProjectionMatrix();
      renderer.setSize(W, H); css3d.setSize(W, H);
      F = computeF();
      const nowMobile = aspect < 1;
      if (nowMobile !== _wasMobile) {
        // Crossed the portrait/landscape boundary: rebuild panel layout, spacing
        // and the scroll path so screens don't overlap in the new orientation.
        _wasMobile = nowMobile;
        xScale = Math.max(0.5, Math.min(1, aspect / 1.35));
        yPos = layoutY();
        xPos = layoutX();
        objs.forEach((o, i) => o.position.set(xPos[i], yPos[i], -1.1));
        if (comp._applyLang) comp._applyLang();
        if (tl) rebuildJourney();
      }
      objs.forEach(o => o.scale.setScalar(F));
      driftCSS.forEach(d => d.o.scale.setScalar(F));
      if (ST) ST.refresh();
    }
    window.addEventListener('resize', onResize);

    comp._fillScreens = function (dict) {
      const s = mk(dict, comp._lang);
      objs.forEach((o, i) => { if (!o.element) return; o.element.style.width = s.widths[i] + 'px'; o.element.innerHTML = s.html[i]; });
    };
    if (comp._applyLang) comp._applyLang();

    function buildJourney() {
      if (tl) return;
      const N = yPos.length;
      tl = gsap.timeline({ scrollTrigger: {
        trigger: '#scroller', start: 'top top', end: 'bottom bottom',
        scrub: 1.4,
        onUpdate: self => {
          if (progressFill) progressFill.style.height = (self.progress * 100).toFixed(1) + '%';
          const h = document.getElementById('hint');
          if (h) {
            const atEnd = self.progress > 0.9;
            if (atEnd && !comp._hintHidden) { comp._hintHidden = true; h.style.animation = ''; gsap.to(h, { opacity: 0, duration: 0.5 }); }
            else if (!atEnd && comp._hintHidden) { comp._hintHidden = false; gsap.to(h, { opacity: 0.65, duration: 0.5, onComplete: () => { h.style.animation = 'hintPulse 3s ease-in-out infinite'; } }); }
          }
        }
      } });
      const exX = ['power2.inOut', 'sine.inOut', 'power3.inOut', 'power1.inOut'];
      const exY = ['power3.inOut', 'power1.inOut', 'sine.inOut', 'power2.inOut'];
      for (let i = 1; i < N; i++) {
        const p = i - 1;
        tl.to(cam, { x: xPos[i], duration: 1, ease: exX[i % exX.length] }, p);
        tl.to(cam, { y: yPos[i], duration: 1, ease: exY[i % exY.length] }, p);
        tl.to(cam, { z: zList[i], duration: 1, ease: 'sine.inOut' }, p);
      }
      requestAnimationFrame(() => { ST.refresh(); setTimeout(() => ST.refresh(), 200); });
    }

    // ---------- open ----------
    const scene = document.getElementById('scene');
    const cover = document.getElementById('cover');
    const hint = document.getElementById('hint');
    const btn = document.getElementById('openBtn');
    let opened = false;
    function open() {
      if (opened) return; opened = true;
      comp._opened = true; clearInterval(comp._coverTimer);
      gsap.to('#ktCard', { scale: 1.04, opacity: 0, duration: 1.0, ease: 'power2.inOut' });
      const spacer = document.createElement('div');
      spacer.id = 'scroller';
      spacer.style.cssText = 'position:relative;width:1px;height:520vh;pointer-events:none;';
      document.body.appendChild(spacer);
      document.documentElement.style.overflow = 'auto';
      document.body.style.overflow = 'visible';
      gsap.to(scene, { opacity: 1, duration: 2.2, ease: 'power1.out' });
      const frameEl = document.getElementById('frame');
      if (frameEl) frameEl.style.display = 'none';
      gsap.to([progressWrap], { opacity: 1, duration: 1.5, delay: 2 });
      if (cover) cover.style.display = 'none';
      gsap.set('.kt-a', { opacity: 0, y: 48 });
      gsap.to('.kt-a', { opacity: 1, y: 0, duration: 1.15, stagger: 0.5, ease: 'power3.out', delay: 2.3 });
      gsap.set(cam, { x: 0, y: 1.2, z: 12, rz: 0 });
      gsap.to(cam, { x: xPos[0], y: yPos[0], z: zList[0], duration: 3.4, ease: 'power3.inOut', onComplete: () => {
        buildJourney();
        gsap.fromTo(hint, { opacity: 0 }, { opacity: 0.65, duration: 1.4, onComplete: () => { hint.style.animation = 'hintPulse 3s ease-in-out infinite'; } });
      }});
    }
    if (btn) btn.addEventListener('click', open);
    comp._openInvitation = open;
    if (comp._introDone) open();

  }
}
</script>
