<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Khoa &amp; Thi</title>
<script>
(function () {
  var path = location.pathname.replace(/^\/+|\/+$/g, '');
  if (/^baohy(\/|$)/.test(path)) {
    var bs = path.replace(/^baohy\/?/, '');
    location.replace(bs === 'links' ? '/baohy/links.html' : '/baohy/' + (bs ? '?g=' + encodeURIComponent(bs) : '') + location.hash); return;
  }
  var simple = false;
  if (/^simple\/(nt|ng)(\/|$)/.test(path)) { simple = true; path = path.replace(/^simple\//, ''); }
  else if (/^min(\/|$)/.test(path)) {
    var s2 = path.replace(/^min\/?/, ''), ac = false;
    if (/^ac(\/|$)/.test(s2)) { ac = true; s2 = s2.replace(/^ac\/?/, ''); }
    if (s2 === 'links') { location.replace('/min' + (ac ? '/ac' : '') + '/links.html'); return; }
    location.replace('/?f=' + (ac ? 'sac' : 's') + (s2 ? '&g=' + encodeURIComponent(s2) : '') + location.hash); return;
  }
  var m = path.match(/^(parents|nhatrai|nhagai|nt2|ng2|nt|ng)(\/|$)/);
  var side = '';
  if (m) { side = /^(nhagai|ng2?)$/.test(m[1]) ? 'ng' : 'nt'; if (/2$/.test(m[1])) simple = true; }
  var slug = path.replace(/^(parents|nhatrai|nhagai|nt2|ng2|nt|ng)\/?/, '');
  if (side && slug === 'links' && m[1] !== 'parents') { location.replace((simple ? '/simple' : '') + '/' + side + '/links.html'); return; }
  var q = [];
  if (side) q.push('f=' + side + (simple ? '2' : ''));
  if (slug) q.push('g=' + encodeURIComponent(slug));
  location.replace('/' + (q.length ? '?' + q.join('&') : '') + location.hash);
})();
</script></head><body></body></html>
