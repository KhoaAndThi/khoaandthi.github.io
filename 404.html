<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Khoa &amp; Thi</title>
<script>
  var path = location.pathname.replace(/^\/+|\/+$/g, '');
  var m = path.match(/^(parents|nhatrai|nhagai)(\/|$)/);
  var side = m ? (m[1] === 'nhagai' ? 'nhagai' : 'nhatrai') : '';
  var slug = path.replace(/^(parents|nhatrai|nhagai)\/?/, '');
  if (side && slug === 'links' && m[1] !== 'parents') { location.replace('/' + side + '/links.html'); }
  else {
    var q = [];
    if (side) q.push('f=' + side);
    if (slug) q.push('g=' + encodeURIComponent(slug));
    location.replace('/' + (q.length ? '?' + q.join('&') : '') + location.hash);
  }
</script></head><body></body></html>
